# =============================================================================
# northstar.mingpixel.net —— 前端静态站 + /api 反向代理
#
# 两条接入路径，按你的环境选一条：
#
#  A) 1Panel 用户（推荐）：先在建站里加好域名和 SSL 证书，然后只把本文件的
#     「location ^~ /api/」与「静态资源」两段粘进 1Panel 生成的站点配置里，
#     注意 root / ssl 那几行不要覆盖，1Panel 已经写好了。
#
#  B) 独立 Nginx / OpenResty：本文件可直接整体使用，按下述注释改 root 与证书路径。
#
# 校验与生效：
#     /usr/local/openresty/nginx/sbin/nginx -t
#     /usr/local/openresty/nginx/sbin/nginx -s reload
#   （1Panel 里点「重载」等同于此）
# =============================================================================

# 后端 Spring Boot（server.port 默认 8080）
upstream northstar_backend {
    server 127.0.0.1:8080;

    # 若后端跑在 Docker 容器里，改成容器名或宿主机地址，例如 server northstarbackend:8080;
    # 用容器名时需保证 OpenResty 与该容器在同一 Docker 网络，且容器端口已 EXPOSE。

    keepalive 32;
}

# HTTP 一律跳 HTTPS。若正在申请证书、需要临时放开 http 校验，先注释掉这个 server 块。
server {
    listen 80;
    server_name northstar.mingpixel.net;
    return 301 https://$host$request_uri;
}

server {
    # 注意：`listen ... http2` 的写法在 nginx >= 1.25.1 上会告警（建议改成 `listen 443 ssl;` + `http2 on;`）。
    # 这里用兼容写法，1Panel 自带的多为 1.21~1.25，两边都能跑。
    listen 443 ssl http2;
    server_name northstar.mingpixel.net;

    # ↓↓↓ 由 1Panel 证书功能自动写入；独立部署时按实际路径修改 ↓↓↓
    ssl_certificate     /www/sites/northstar.mingpixel.net/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/northstar.mingpixel.net/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 前端构建产物：把 vite 的 dist/ 内容放在这里（index.html 直接位于该目录下）
    root /www/sites/northstar.mingpixel.net/index;
    index index.html;

    charset utf-8;

    # -------------------------------------------------------------------------
    # ⚠️ Cloudflare 真实 IP —— 按 IP 限流的硬前提，漏配会让全站共用一份配额
    # -------------------------------------------------------------------------
    # 本站前面挂了 Cloudflare。不配这段时 $remote_addr 是 CF 边缘节点 IP，
    # 所有玩家看起来是同一个来源：后端登录（30 次/5 分钟）、发码（5 次/10 分钟）
    # 等按 IP 限流会退化成「全站共用一个配额」，正常用户也会被 429 挡住。
    #
    # set_real_ip_from 决定「谁有权声明真实 IP」。只填 Cloudflare 官方段，
    # 绝不能写 0.0.0.0/0 —— 那等于允许任何人伪造 CF-Connecting-IP 绕过限流。
    # 段列表见 https://www.cloudflare.com/ips/ （IPv4 / IPv6 各一张，官方会更新，需定期同步）
    #
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # ... 按官方最新列表补齐 IPv4 + IPv6 ...
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;

    # 白名单 CSV 导入是 POST 文本，默认 1m 对大批量名单偏小
    client_max_body_size 8m;

    access_log /www/sites/northstar.mingpixel.net/log/access.log;
    error_log  /www/sites/northstar.mingpixel.net/log/error.log;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml;

    # -------------------------------------------------------------------------
    # /api -> Spring Boot
    # -------------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://northstar_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # 配合 upstream keepalive，避免每请求新建连接

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # ⚠️ 关键：这里必须用 $remote_addr「覆盖」，不要用 $proxy_add_x_forwarded_for 追加。
        #
        #   后端 ClientIp.of() 优先采信 request.getRemoteAddr()（由 Spring 的
        #   forward-headers-strategy=framework 从 X-Forwarded-For 还原），
        #   而 request.getRemoteAddr() 的值就是这个头 —— 也就是说 X-Forwarded-For
        #   一旦被「追加」，客户端自带的 X-Forwarded-For: 1.2.3.4 会排到最前并被还原进去，
        #   第 1 条取值路径直接被污染，换个假 IP 就绕过了限流。
        #
        #   前提：上面的 real_ip_header 已配好，$remote_addr 才是玩家真实 IP。
        proxy_set_header X-Forwarded-For   $remote_addr;

        # 客户端 Mod 的校验接口与登录接口的响应都不可缓存
        proxy_buffering off;

        # 发验证码走同步 SMTP，弱网下可能超过默认 60s 中的一部分，显式放宽
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # -------------------------------------------------------------------------
    # 静态资源
    # -------------------------------------------------------------------------
    # 注意：后端下发的 HSTS / CSP / X-Frame-Options 等安全头只作用于 /api/**，
    # 静态页面由本服务直接返回，不受其保护。想让页面也带上安全头，取消下面注释。
    # CSP 已按本项目的实际资源写好（内联 style 属性 + data: 图片 + 自托管图标字体），
    # 改完务必先 `curl -sI` 看响应头、再开无痕窗口打开站点确认没白屏。
    # add_header X-Content-Type-Options nosniff always;
    # add_header X-Frame-Options DENY always;
    # add_header Referrer-Policy strict-origin-when-cross-origin always;
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # vite 产物带内容哈希（assets/index-a1b2c3.js），可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 绝不能缓存，否则前端发版后老用户仍跑旧版本、调不到新接口
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /favicon.svg {
        expires 7d;
        access_log off;
    }

    # 前端用的是 hash 路由（createWebHashHistory），URL 形如 /#/admin，
    # 服务端只会看到 "/"，因此刷新任意页面都不会 404，不需要 SPA fallback 兜底。
    # 下面这行只是防止将来改成 history 模式后漏配 —— 真要切换时它是必需的。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
